[project]
name = "yelp-sentiment"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "N-Mehdi", email = "mehdineji14@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[project.scripts]
yelp-sentiment = "yelp_sentiment:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
